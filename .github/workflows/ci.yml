name: CI

# One required check, "ci", runs on every pull request. Main only ever changes
# through a pull request, so there is no push trigger: a squash merge would
# just rerun the tree the pull request already proved.
#
# The "full" job adds release-only legs (the newest supported Python and the
# Pydantic floor). Dispatch this workflow with full=true on the exact commit
# that is about to be released.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only legs
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Every pip resolution in this workflow, build isolation included, takes
  # only versions uploaded at least seven days ago. The dependency age steps
  # then verify what was actually installed against the registry and fail
  # closed, so a pip that ignores this setting cannot slip a fresh upload in.
  PIP_UPLOADED_PRIOR_TO: P7D

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # Nothing is installed yet. The vendored spec and the generator must
      # match the hashes the spec bot recorded in MANIFEST.json. The script
      # reads the manifest itself, so no PR-editable value reaches a shell.
      - name: Vendored spec and generator match MANIFEST
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import sys

          manifest = json.load(open("vendor/spec/MANIFEST.json"))
          checks = [
              ("vendor/spec/openapi.yaml", manifest["openapiSha256"]),
              ("scripts/gen.mjs", manifest["generators"]["python"]["sha256"]),
          ]
          failed = False
          for path, expected in checks:
              actual = hashlib.sha256(open(path, "rb").read()).hexdigest()
              if actual != expected:
                  failed = True
                  print(f"ERROR: {path} does not match MANIFEST.json")
                  print(f"  MANIFEST: {expected}")
                  print(f"  actual:   {actual}")
          sys.exit(1 if failed else 0)
          PY

      # The public API of the published package is frozen at 1.0. This diffs
      # the live source surface against the reviewed api-surface.txt. It is a
      # stdlib-only ast walk, so it needs no install. Deliberate API changes
      # regenerate the golden with 'make api-surface'.
      - name: Check 1.0 public API surface
        run: python3 scripts/check_api_surface.py --check

      # One environment for the CI tools, the package and its test tools, and
      # a clean venv holding the published package alone: that venv is the
      # production closure the license check inspects.
      - name: Install the CI tools, the package and its test tools
        run: |
          pip install --quiet mypy==2.4.0 pip-licenses==5.5.5 -e "client[dev]" -e ".[dev]"
          python -m venv "$RUNNER_TEMP/prod-closure"
          "$RUNNER_TEMP/prod-closure/bin/pip" install --quiet ./client

      # Quarantine: nothing third-party installed above, nor the generator's
      # pinned requirements, may have been uploaded in the last seven days.
      - name: Dependency age (seven-day quarantine)
        run: |
          pip list --format=freeze > "$RUNNER_TEMP/tools.txt"
          "$RUNNER_TEMP/prod-closure/bin/pip" list --format=freeze > "$RUNNER_TEMP/closure.txt"
          python3 scripts/check_dependency_age.py --lockfile "$RUNNER_TEMP/tools.txt" --lockfile "$RUNNER_TEMP/closure.txt" --lockfile tools/requirements-regen.txt

      # make lint installs ruff into .venv and runs it in one recipe, so its
      # age check can only follow it.
      - name: Lint and check formatting (ruff)
        run: make lint

      - name: Dependency age of the lint tools (seven-day quarantine)
        run: |
          .venv/bin/pip list --format=freeze > "$RUNNER_TEMP/lint-tools.txt"
          python3 scripts/check_dependency_age.py --lockfile "$RUNNER_TEMP/lint-tools.txt"

      # The published py.typed annotations are checked in --strict mode
      # (config in the root pyproject.toml) so a PEP 561 consumer running
      # mypy never sees errors our own CI did not.
      - name: Static type check (mypy --strict)
        run: mypy

      # License compliance over the production closure. certifi (MPL-2.0,
      # transitive of httpx) is the single reviewed exception and is gated
      # separately so the main allowlist stays permissive-only; rationale in
      # THIRD-PARTY-NOTICES.md.
      - name: Dependency license compliance
        run: |
          pip-licenses --python "$RUNNER_TEMP/prod-closure/bin/python" --from=mixed \
            --ignore-packages certifi \
            --allow-only "MIT;MIT License;BSD;BSD License;BSD-2-Clause;BSD-3-Clause;ISC;ISC License (ISCL);Apache-2.0;Apache Software License;PSF-2.0;Python Software Foundation License"
          pip-licenses --python "$RUNNER_TEMP/prod-closure/bin/python" --from=mixed \
            --packages certifi \
            --allow-only "MPL-2.0;Mozilla Public License 2.0 (MPL 2.0)"

      # THIRD-PARTY-NOTICES.md is generated from the package's declared
      # runtime dependencies; regenerate and diff so it cannot go stale.
      - name: Third-party notices are current
        run: |
          "$RUNNER_TEMP/prod-closure/bin/python" scripts/gen-notices.py
          git diff --exit-code THIRD-PARTY-NOTICES.md

      # The shipped models must match the vendored OpenAPI and JSON Schema
      # contracts. The helper module is handwritten; declarations are not
      # duplicated there.
      - uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474 # v7.0.0
        with:
          node-version: "22"

      - name: Shipped models match the vendored contracts
        run: |
          make regen
          if ! git diff --exit-code -- client/ezclassify_rest_client/models.py; then
            echo "ERROR: Shipped generated models differ from the vendored contracts."
            echo "Run 'make regen' locally and commit models.py."
            exit 1
          fi

      - name: Test ezclassify-rest-client
        working-directory: client
        run: pytest

      # Registry-free: stdlib mocks and local editable installs. Its live
      # MCP tests are a separate lane, 'make test-mcp-live', which needs a
      # licensed runtime.
      - name: Test llm-classify example
        working-directory: examples/llm-classify
        run: pytest tests/

      - name: Conformance suite (repo-root test harness)
        run: pytest tests/

      - name: Working tree is clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  # Release evidence only. Dispatch with full=true on the commit to release.
  full:
    name: full (${{ matrix.label }})
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: python 3.14
            python-version: "3.14"
            floor: false
          # The oldest supported Python on the oldest Pydantic the package
          # declares. Keyword construction stays strict and decoding stays
          # open through a Pydantic 2 init marker; the ci job only ever sees
          # the latest Pydantic.
          - label: pydantic floor
            python-version: "3.11"
            floor: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test tools
        run: pip install --quiet -e "client[dev]" -e ".[dev]"

      - name: Dependency age of the test tools (seven-day quarantine)
        run: |
          pip list --format=freeze > "$RUNNER_TEMP/test-tools.txt"
          python3 scripts/check_dependency_age.py --lockfile "$RUNNER_TEMP/test-tools.txt"

      - name: Test ezclassify-rest-client
        if: ${{ !matrix.floor }}
        working-directory: client
        run: pytest

      - name: Test llm-classify example
        if: ${{ !matrix.floor }}
        working-directory: examples/llm-classify
        run: pytest tests/

      - name: Conformance suite (repo-root test harness)
        if: ${{ !matrix.floor }}
        run: pytest tests/

      - name: Construction and decoding split on the Pydantic floor
        if: ${{ matrix.floor }}
        working-directory: client
        run: |
          pip install --quiet "pydantic==2.14.1"
          pip list --format=freeze > "$RUNNER_TEMP/floor.txt"
          python3 ../scripts/check_dependency_age.py --lockfile "$RUNNER_TEMP/floor.txt"
          pytest --no-cov tests/test_wire_fidelity.py -k "ConstructionClosed or UnknownResponse or UnknownRequest"

      - name: Working tree is clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
